name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check style, test and package
        run: mvn -B -ntp -Pci clean verify
      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-and-tests
          path: |
            target/site/jacoco/
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          if-no-files-found: warn
